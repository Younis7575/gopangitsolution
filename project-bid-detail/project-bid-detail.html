<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, follow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Gopang IT Solution</title>
    <link rel="shortcut icon" href="/assets/img/favicon.png">
    <link rel="stylesheet" href="/assets/css/icons.css">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/custom/site.css">
    <link rel="stylesheet" href="/assets/css/premium.css">
    <link rel="stylesheet" href="/assets/css/pages/project-based-hiring.css">
</head>
<body class="body-wrapper project-hiring-page marketplace-page">
    <header class="marketplace-header">
        <div class="container marketplace-header-inner">
            <a href="/" class="marketplace-logo"><img src="/assets/img/logo.svg" alt="Gopang IT Solution"></a>
            <nav><a href="/project-based-hiring">Browse Projects</a><a href="/contact">Contact</a><a href="/" class="marketplace-home-btn">Back to Site</a></nav>
        </div>
    </header>
    <main>
        <section class="marketplace-subhero">
            <div class="container">
                <a href="/project-based-hiring" class="marketplace-back-link"><i class="fal fa-arrow-left"></i> All open projects</a>
                <span>Project Brief</span>
                <h1 id="detail-page-title">Loading project...</h1>
                <p>Review the complete scope before submitting your proposal.</p>
            </div>
        </section>
        <section class="marketplace-detail-section">
            <div class="container">
                <div id="project-detail-state" class="marketplace-state"><span class="gis-loader"></span><p>Loading project details...</p></div>
                <div id="project-detail-page" class="marketplace-detail-layout d-none">
                    <article class="marketplace-detail-card">
                        <div id="project-detail-main"></div>
                    </article>
                    <aside class="marketplace-side-card">
                        <div id="project-detail-summary"></div>
                        <a id="submit-proposal-link" href="#" class="theme-btn marketplace-primary-action">Submit a Proposal</a>
                        <p class="marketplace-no-coins"><i class="fal fa-check-circle"></i> Free to bid — no coins or connects required.</p>
                    </aside>
                </div>
            </div>
        </section>
    </main>
    <script src="/assets/js/pages/project-bid-detail.js" defer></script>
    <!-- Gopang Analytics --><script src="/assets/js/analytics-tracker.js" defer></script>
</body>
</html>
