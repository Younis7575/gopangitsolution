<!DOCTYPE html>
<html lang="en">

<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9355105941780970" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin News Panel | Gopang IT Solution</title>
    <link rel="shortcut icon" href="/assets/img/favicon.png">
    <link rel="stylesheet" href="/assets/css/icons.css">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/custom/site.css">
    <link rel="stylesheet" href="/assets/css/premium.css">
    <link rel="stylesheet" href="/assets/css/admin/admin-jobs.css">
    <link rel="stylesheet" href="/assets/css/admin/admin-news.css">
    <script>
        if (localStorage.getItem("isAdminLoggedIn") !== "true") {
            window.location.replace("/admin-login");
        }
    </script>
</head>

<body class="body-wrapper admin-jobs-page">
    <header class="admin-header">
        <div class="container">
            <div class="admin-header-inner">
                <a href="/" class="admin-logo">
                    <img src="/assets/img/logo.svg" alt="Gopang IT Solution">
                </a>
                <div class="admin-header-actions">
                    <a href="/news" class="admin-link">View News</a>
                    <button type="button" id="admin-logout" class="admin-ghost-btn">Logout</button>
                    <a href="/" class="theme-btn">Back to Site</a>
                </div>
            </div>
        </div>
    </header>

    <aside class="admin-sidebar" aria-label="Admin navigation">
        <nav>
            <a href="/admin-dashboard"><i class="fal fa-chart-pie" aria-hidden="true"></i> Dashboard</a>
            <a href="/admin-jobs"><i class="fal fa-briefcase" aria-hidden="true"></i> Jobs</a>
            <a href="/admin-applications"><i class="fal fa-file-user" aria-hidden="true"></i> Applications</a>
            <a href="/admin-news" class="active"><i class="fal fa-newspaper" aria-hidden="true"></i> News</a>
            <a href="/admin-submissions#partners"><i class="fal fa-handshake" aria-hidden="true"></i> Apply as Partner</a>
            <a href="/admin-submissions#proposals"><i class="fal fa-file-alt" aria-hidden="true"></i> Proposals</a>
            <a href="/admin-project-hiring"><i class="fal fa-users-cog" aria-hidden="true"></i> Project Hiring Requests</a>
        </nav>
    </aside>

    <main class="admin-main">
        <section class="admin-hero">
            <div class="container">
                <span class="admin-kicker">News Management</span>
                <h1>Admin News Panel</h1>
                <p>Add, edit, publish, and remove website news from one protected dashboard.</p>
                <div id="global-message" class="admin-alert d-none" role="alert"></div>
            </div>
        </section>

        <section class="admin-content">
            <div class="container">
                <div class="admin-grid">
                    <section class="admin-panel admin-form-panel" aria-labelledby="news-form-title">
                        <div class="admin-panel-heading">
                            <div>
                                <span class="admin-kicker">Editor</span>
                                <h2 id="news-form-title">Add News</h2>
                            </div>
                            <button type="button" id="reset-news-form" class="admin-ghost-btn">Clear</button>
                        </div>

                        <form id="news-form" class="admin-form">
                            <input type="hidden" id="news-id">

                            <div class="admin-field">
                                <label for="news-title">Title</label>
                                <input type="text" id="news-title" required>
                            </div>

                            <div class="admin-field">
                                <label for="news-slug">Slug</label>
                                <input type="text" id="news-slug" required>
                            </div>

                            <div class="admin-field">
                                <label for="news-short-description">Short Description</label>
                                <textarea id="news-short-description" rows="3" required></textarea>
                            </div>

                            <div class="admin-field">
                                <label for="news-content">Content</label>
                                <textarea id="news-content" rows="8" required></textarea>
                            </div>

                            <div class="admin-field">
                                <label for="news-image-url">Image URL</label>
                                <input type="url" id="news-image-url" placeholder="https://example.com/image.jpg">
                            </div>

                            <div class="admin-two-col">
                                <div class="admin-field">
                                    <label for="news-author">Author</label>
                                    <input type="text" id="news-author" value="Admin">
                                </div>

                                <div class="admin-field">
                                    <label for="news-status">Status</label>
                                    <select id="news-status">
                                        <option value="published">Published</option>
                                        <option value="draft">Draft</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" id="save-news-btn" class="theme-btn admin-submit-btn">Add News</button>
                        </form>
                    </section>

                    <section class="admin-panel" aria-labelledby="news-list-title">
                        <div class="admin-panel-heading">
                            <div>
                                <span class="admin-kicker">Published Content</span>
                                <h2 id="news-list-title">News List</h2>
                            </div>
                            <button type="button" id="refresh-news" class="admin-ghost-btn">Refresh</button>
                        </div>
                        <div id="news-loading" class="admin-loading">Loading news...</div>
                        <div id="news-list" class="admin-card-list"></div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <script src="/assets/js/admin/admin-news.js"></script>
</body>

</html>
