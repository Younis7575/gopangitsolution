<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="robots" content="noindex, follow">
<meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Gopang IT Solution</title>
    <link rel="shortcut icon" href="/assets/img/favicon.png">
    <link rel="stylesheet" href="/assets/css/icons.css">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/custom/site.css">
    <link rel="stylesheet" href="/assets/css/premium.css">
    <link rel="stylesheet" href="/assets/css/admin/admin-login.css">
</head>

<body class="body-wrapper admin-login-page">
    <main class="admin-login-shell">
        <section class="admin-login-card" aria-labelledby="admin-login-title">
            <a href="/" class="admin-login-logo">
                <img src="/assets/img/logo.svg" alt="Gopang IT Solution">
            </a>

            <span class="admin-login-kicker">Admin Access</span>
            <h1 id="admin-login-title">Login to Jobs Panel</h1>
            <p>Manage job posts and review submitted applications.</p>

            <div id="login-message" class="admin-login-alert d-none" role="alert"></div>

            <form id="admin-login-form" class="admin-login-form">
                <div class="admin-login-field">
                    <label for="admin-email">Email</label>
                    <input type="email" id="admin-email" name="email" autocomplete="username" required>
                </div>

                <div class="admin-login-field">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" id="admin-login-btn" class="theme-btn admin-login-btn">Login</button>
            </form>

            <a href="/" class="admin-login-back">Back to website</a>
        </section>
    </main>

    <script src="/assets/js/admin/admin-login.js"></script>
</body>

</html>
