name: Deploy Website via FTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install LFTP
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy Website
        env:
          FTP_HOST: ftp.gopangitsolution.com
          FTP_USERNAME: younas@gopangitsolution.com
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: 21
          REMOTE_DIR: /public_html

        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://$FTP_HOST:$FTP_PORT <<EOF
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 2
          set net:timeout 30
          set cmd:fail-exit yes

          echo "Remote before deploy:"
          pwd
          cls

          cd $REMOTE_DIR

          mirror --reverse \
            --delete \
            --verbose \
            --parallel=3 \
            --ignore-time \
            --size-only \
            --exclude-glob ".git/**" \
            --exclude-glob ".github/**" \
            --exclude-glob "node_modules/**" \
            --exclude-glob "vendor/**" \
            --exclude-glob ".env" \
            --exclude-glob "storage/**" \
            ./ .

          echo "Deployment Finished"
          cls
          bye
          EOF
