name: Deploy Website

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Show Repository
        run: |
          pwd
          ls -lah
          git log -1

      - name: Deploy
        env:
          FTP_HOST: ftp.gopangitsolution.com
          FTP_USERNAME: younas@gopangitsolution.com
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

        run: |
          lftp -d -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://$FTP_HOST <<EOF

          set ssl:verify-certificate no
          set ftp:passive-mode on
          set cmd:fail-exit yes
          set xfer:clobber yes

          cd /

          mirror -R \
            --verbose \
            --delete \
            --parallel=1 \
            --ignore-time \
            --exclude-glob ".git*" \
            --exclude-glob ".github/**" \
            --exclude "api/uploads/" \
            --exclude-glob "api/config.php" \
            . .

          echo "===== AFTER DEPLOY ====="

          cls

          bye
          EOF
