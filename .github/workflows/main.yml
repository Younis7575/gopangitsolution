name: Deploy Website

on:
  push:
    branches:
      - master
  # Allows a re-deploy without making an empty commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Show Repository
        run: |
          pwd
          ls -lah
          git log -1

      # The mirror occasionally uploads only part of the tree and still exits 0,
      # which left HTML files and .htaccess on the server for days. So: mirror,
      # verify the bytes the site actually serves, and retry once before failing.
      - name: Deploy and verify
        env:
          FTP_HOST: ftp.gopangitsolution.com
          FTP_USERNAME: younas@gopangitsolution.com
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE: https://gopangitsolution.com
        run: |
          set -uo pipefail

          deploy() {
            lftp -d -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://$FTP_HOST <<EOF

          set ssl:verify-certificate no
          set ftp:passive-mode on
          set cmd:fail-exit yes
          set xfer:clobber yes
          set net:max-retries 5
          set net:timeout 60
          set net:reconnect-interval-base 2

          cd /

          mirror -R \
            --verbose \
            --delete \
            --parallel=1 \
            --ignore-time \
            --exclude-glob ".git*" \
            --exclude-glob ".github/**" \
            --exclude "api/uploads/" \
            --exclude "api/data/" \
            --exclude-glob "api/config.local.php" \
            . .

          bye
          EOF
          }

          verify() {
            problems=0

            check() {
              local label="$1" file="$2" url="$3"
              local tmp
              tmp="$(mktemp)"
              if ! curl -sS --max-time 90 --retry 3 --retry-delay 5 "$url" -o "$tmp"; then
                echo "::error::$label - could not download $url"
                problems=$((problems + 1))
              elif cmp -s "$file" "$tmp"; then
                echo "OK   $label"
              else
                echo "::error::$label - live copy is stale (repo $(wc -c <"$file") bytes, live $(wc -c <"$tmp") bytes)"
                problems=$((problems + 1))
              fi
              rm -f "$tmp"
            }

            # The bytes the site serves must be the bytes that were committed.
            check "home.html"           home.html                          "$SITE/?cb=$GITHUB_RUN_ID-$1"
            check "premium.css"         assets/css/premium.css            "$SITE/assets/css/premium.css?cb=$GITHUB_RUN_ID-$1"
            check "opportunities.js"    assets/js/pages/opportunities.js  "$SITE/assets/js/pages/opportunities.js?cb=$GITHUB_RUN_ID-$1"
            check "student-projects"    student-projects/index.html       "$SITE/student-projects/?cb=$GITHUB_RUN_ID-$1"

            # /portfolio must serve the portfolio page, not the Apply page.
            if curl -sS --max-time 60 "$SITE/portfolio" | grep -q "Our Projects"; then
              echo "OK   /portfolio serves the portfolio page"
            else
              echo "::error::/portfolio does not serve the portfolio page"
              problems=$((problems + 1))
            fi

            return "$problems"
          }

          for attempt in 1 2; do
            echo "===== MIRROR ATTEMPT $attempt ====="
            deploy || echo "::warning::mirror command reported a non-zero exit"
            echo "===== VERIFY ATTEMPT $attempt ====="
            if verify "$attempt"; then
              echo "===== DEPLOY OK on attempt $attempt ====="
              exit 0
            fi
            echo "===== VERIFY FAILED ON ATTEMPT $attempt ====="
            [ "$attempt" = "2" ] || sleep 20
          done

          echo "::error::deployment did not reach the server after 2 attempts - see the errors above"
          exit 1
